name: terracap-conecta

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: terracap-conecta:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be set}
  env_file:
    - .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - app-storage:/app/storage/app
  networks:
    - terracap
  logging: *default-logging

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - name: web
        target: 80
        published: "8011"
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: http
    cpus: 0.50
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$response = @file_get_contents('http://127.0.0.1/up'); exit($$response === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    <<: *app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=2
      - --tries=3
      - --timeout=120
    cpus: 0.25
    mem_limit: 512m
    stop_grace_period: 135s

  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    env_file:
      - .env.database
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - terracap
    cpus: 0.50
    mem_limit: 1536m
    shm_size: 128m
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backup:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.database
    environment:
      POSTGRES_HOST: db
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/backup.sh
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - database-backups:/backups
    networks:
      - terracap
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

networks:
  terracap:
    name: terracap-conecta-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

volumes:
  app-storage:
    name: terracap-conecta-app-storage

  postgres-data:
    name: terracap-conecta-postgres-data

  database-backups:
    name: terracap-conecta-database-backups
